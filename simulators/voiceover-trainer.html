<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your voiceover trainer · AI, Your Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FFF8F0;--ink:#1E1B2E;--coral:#FF6B6B;--yellow:#FFD93D;--mint:#6BCB77;--sky:#4D96FF;--grape:#9B5DE5;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:'Nunito',sans-serif;color:var(--ink)}
  #stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;background:var(--bg)}
  svg#dia{position:absolute;left:0;top:0;width:1600px;height:900px}
  .h{font-family:'Baloo 2',cursive;font-weight:800;fill:var(--ink)}
  .b{font-family:'Nunito',sans-serif;fill:var(--ink)}
  .m{font-family:'JetBrains Mono',monospace;fill:var(--ink)}
  .comp{cursor:pointer;transition:opacity .35s, transform .2s;transform-box:fill-box}
  .comp .bg{stroke:var(--ink);stroke-width:4;transition:stroke-width .2s, filter .2s}
  .comp:hover .bg,.comp:focus .bg{stroke-width:6;filter:drop-shadow(0 6px 0 rgba(30,27,46,.18))}
  .comp:focus{outline:none}
  .dimmed .comp:not(.active), .dimmed .arrow:not(.active), .dimmed .alabel:not(.active){opacity:.28}
  .comp.active .bg{stroke-width:6;filter:drop-shadow(0 0 0 #FFD93D) drop-shadow(0 0 10px rgba(255,217,61,.95))}
  .arrow path.line{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .arrow path.halo{fill:none;stroke:var(--bg);stroke-width:14;stroke-linecap:round}
  .arrow.active path.line{stroke:var(--coral);stroke-dasharray:12 10;animation:flow .8s linear infinite}
  .arrow, .alabel{transition:opacity .35s}
  @keyframes flow{to{stroke-dashoffset:-22}}
  .token{fill:var(--yellow);stroke:var(--ink);stroke-width:3}
  .badge circle{fill:var(--yellow);stroke:var(--ink);stroke-width:3}
  .badge text{font-family:'Baloo 2';font-weight:800;font-size:18px;text-anchor:middle;fill:var(--ink)}
  .fadein{animation:fi .5s ease}
  @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .pop{animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

  /* caption / controls panel */
  #panel{position:absolute;left:30px;top:684px;width:1000px;height:160px;background:#fff;border:4px solid var(--ink);border-radius:24px;padding:16px 22px;display:flex;gap:20px;align-items:stretch}
  #panel .txt{flex:1;min-width:0;display:flex;flex-direction:column}
  #stepno{font-family:'Baloo 2';font-weight:700;font-size:15px;color:#fff;background:var(--grape);border-radius:999px;padding:1px 12px;align-self:flex-start}
  #captitle{font-family:'Baloo 2';font-weight:800;font-size:27px;line-height:1.15;margin:4px 0 2px}
  #captext{font-size:17px;line-height:1.35}
  #panel .ctr{display:flex;flex-direction:column;justify-content:center;gap:10px;width:250px}
  .row{display:flex;gap:10px}
  button{font-family:'Baloo 2';font-weight:800;font-size:19px;border:4px solid var(--ink);border-radius:16px;padding:4px 14px;cursor:pointer;background:#fff;color:var(--ink);transition:transform .1s, box-shadow .1s;box-shadow:0 4px 0 var(--ink)}
  button:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  button:disabled{opacity:.4;cursor:default;transform:none;box-shadow:0 4px 0 var(--ink)}
  #play{background:var(--yellow);flex:1}
  #back,#next{flex:1}
  #dots{display:flex;gap:6px;justify-content:center}
  #dots span{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff;cursor:pointer}
  #dots span.on{background:var(--coral)}

  /* info card */
  #card{position:absolute;width:390px;background:#fff;border:4px solid var(--ink);border-radius:24px;padding:18px 20px 16px;box-shadow:0 8px 0 rgba(30,27,46,.2);display:none;z-index:10}
  #card.show{display:block;animation:fi .25s ease}
  #card .tag{display:inline-block;font-family:'Baloo 2';font-weight:800;font-size:14px;border:3px solid var(--ink);border-radius:999px;padding:0 10px;margin-bottom:6px}
  #card h3{font-family:'Baloo 2';font-weight:800;font-size:26px;margin:0 0 6px;line-height:1.1}
  #card .k{font-family:'Baloo 2';font-weight:700;font-size:15px;color:var(--grape);margin-top:8px;text-transform:uppercase;letter-spacing:.5px}
  #card .v{font-size:16px;line-height:1.35}
  #card .io{display:flex;gap:10px;margin-top:8px}
  #card .io div{flex:1;border:3px solid var(--ink);border-radius:16px;padding:6px 10px;font-size:15px;line-height:1.3}
  #card .io b{font-family:'Baloo 2';display:block;font-size:15px}
  #card .x{position:absolute;right:12px;top:10px;width:34px;height:34px;padding:0;font-size:18px;border-radius:50%;box-shadow:0 3px 0 var(--ink)}
</style>
</head>
<body>
<div id="stage">
<svg id="dia" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Your voiceover trainer diagram">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E1B2E"/></marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF6B6B"/></marker>
  </defs>

  <!-- Header -->
  <text class="h" x="30" y="58" font-size="46">Your voiceover trainer</text>
  <text class="b" x="32" y="86" font-size="18" font-weight="600">How we teach an AI to sound like you, one round at a time</text>
  <g id="roundpill" transform="translate(1120,34)">
    <rect width="150" height="40" rx="20" fill="#9B5DE5" stroke="#1E1B2E" stroke-width="4"/>
    <text id="roundtxt" class="h" x="75" y="28" font-size="20" text-anchor="middle" fill="#fff" style="fill:#fff">Round 1</text>
  </g>
  <g transform="translate(1290,34)">
    <rect width="280" height="40" rx="20" fill="#fff" stroke="#1E1B2E" stroke-width="4"/>
    <text class="b" x="140" y="26" font-size="16" font-weight="800" text-anchor="middle">Click any box to learn more</text>
  </g>

  <g id="arrows">
    <!-- a: library -> her text panel -->
    <g class="arrow" id="ar-a"><path class="line" d="M334,222 L692,222" marker-end="url(#ah)"/></g>
    <!-- b: voiceover.md -> writer -->
    <g class="arrow" id="ar-b"><path class="line" d="M334,400 C360,400 360,425 378,425" marker-end="url(#ah)"/></g>
    <!-- c: topic -> writer -->
    <g class="arrow" id="ar-c"><path class="line" d="M334,562 C360,562 360,505 378,505" marker-end="url(#ah)"/></g>
    <!-- d: writer -> AI panel (over the top) -->
    <g class="arrow" id="ar-d"><path class="halo" d="M507,346 L507,118 L1028,118 L1028,166"/><path class="line" d="M507,346 L507,118 L1028,118 L1028,166" marker-end="url(#ah)"/></g>
    <!-- e: compare -> judge -->
    <g class="arrow" id="ar-e"><path class="line" d="M915,429 L915,450" marker-end="url(#ah)"/></g>
    <!-- f: judge -> decision -->
    <g class="arrow" id="ar-f"><path class="line" d="M1154,500 C1180,500 1170,250 1194,250" marker-end="url(#ah)"/></g>
    <!-- g: decision -> updater (right edge) -->
    <g class="arrow" id="ar-g"><path class="line" d="M1574,250 L1588,250 L1588,560 L1578,560" marker-end="url(#ah)"/></g>
    <!-- h: decision -> shelf -->
    <g class="arrow" id="ar-h"><path class="line" d="M1300,354 L1300,370" marker-end="url(#ah)"/></g>
    <!-- loop: updater -> voiceover.md -->
    <g class="arrow" id="ar-loop"><path class="line" d="M1385,629 L1385,655 L14,655 L14,400 L24,400" marker-end="url(#ah)"/></g>
  </g>

  <!-- arrow labels -->
  <g class="alabel" id="lb-a"><rect x="560" y="203" width="118" height="26" rx="13" fill="#6BCB77" stroke="#1E1B2E" stroke-width="3"/><text class="b" x="619" y="221" font-size="13" font-weight="800" text-anchor="middle">your real text</text></g>
  <g class="alabel" id="lb-d"><rect x="700" y="105" width="92" height="26" rx="13" fill="#4D96FF" stroke="#1E1B2E" stroke-width="3"/><text class="b" x="746" y="123" font-size="13" font-weight="800" text-anchor="middle" style="fill:#fff">AI draft</text></g>
  <g class="alabel" id="lb-h"><rect x="1312" y="350" width="96" height="24" rx="12" fill="#6BCB77" stroke="#1E1B2E" stroke-width="3"/><text class="b" x="1360" y="367" font-size="13" font-weight="800" text-anchor="middle">if approved</text></g>
  <g class="alabel" id="lb-g"><g transform="translate(1588,405) rotate(90)"><rect x="-56" y="-12" width="112" height="24" rx="12" fill="#FFD93D" stroke="#1E1B2E" stroke-width="3"/><text class="b" x="0" y="5" font-size="13" font-weight="800" text-anchor="middle">your comment</text></g></g>
  <g class="alabel comp" id="lb-loop" data-card="loop" tabindex="0"><rect class="bg" x="430" y="640" width="560" height="30" rx="15" fill="#FFD93D"/><text class="b" x="710" y="661" font-size="15" font-weight="800" text-anchor="middle">Feedback loop: a new rule goes back into voiceover.md</text></g>

  <!-- 1 Voice library -->
  <g class="comp" id="c-library" data-card="library" tabindex="0">
    <rect class="bg" x="30" y="135" width="300" height="165" rx="24" fill="#E6F7E8"/>
    <g transform="translate(46,160)">
      <rect x="8" y="0" width="44" height="56" rx="6" fill="#fff" stroke="#1E1B2E" stroke-width="3" transform="rotate(-8 30 28)"/>
      <rect x="4" y="6" width="44" height="56" rx="6" fill="#6BCB77" stroke="#1E1B2E" stroke-width="3"/>
      <line x1="12" y1="20" x2="40" y2="20" stroke="#1E1B2E" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="31" x2="40" y2="31" stroke="#1E1B2E" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="42" x2="32" y2="42" stroke="#1E1B2E" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text class="h" x="112" y="174" font-size="25">Voice library</text>
    <text class="b" x="113" y="196" font-size="14" font-weight="700">your own words, no AI</text>
    <text class="b" x="113" y="232" font-size="15">✎ Old posts</text>
    <text class="b" x="113" y="256" font-size="15">✎ Video scripts</text>
    <text class="b" x="113" y="280" font-size="15">✎ Retreat notes</text>
    <g class="badge" transform="translate(30,135)"><circle r="16"/><text y="6">1</text></g>
  </g>

  <!-- 2 voiceover.md -->
  <g class="comp" id="c-vmd" data-card="vmd" tabindex="0">
    <rect class="bg" x="30" y="320" width="300" height="160" rx="24" fill="#F1E8FC"/>
    <text class="m" x="52" y="358" font-size="20" font-weight="700">voiceover.md</text>
    <text class="b" x="52" y="380" font-size="14" font-weight="700">your style rules</text>
    <text class="m" x="52" y="406" font-size="13">- Warm, calm and kind</text>
    <text class="m" x="52" y="426" font-size="13">- Short sentences</text>
    <text class="m" x="52" y="446" font-size="13">- Talk to "you"</text>
    <g id="newrule" style="display:none">
      <rect x="44" y="452" width="232" height="22" rx="8" fill="#FFD93D" stroke="#1E1B2E" stroke-width="2"/>
      <text class="m" x="52" y="468" font-size="13" font-weight="700">+ Open with a question</text>
    </g>
    <g class="badge" transform="translate(30,320)"><circle r="16"/><text y="6">2</text></g>
  </g>

  <!-- 3 Topic -->
  <g class="comp" id="c-topic" data-card="topic" tabindex="0">
    <rect class="bg" x="30" y="500" width="300" height="125" rx="24" fill="#FFF3C4"/>
    <text class="h" x="52" y="536" font-size="25">Topic</text>
    <text class="b" x="128" y="535" font-size="14" font-weight="700">what to write about</text>
    <rect x="50" y="556" width="260" height="44" rx="22" fill="#fff" stroke="#1E1B2E" stroke-width="3"/>
    <text class="b" x="72" y="584" font-size="17" font-weight="800">Human Psychology</text>
    <rect x="248" y="566" width="3" height="24" fill="#FF6B6B"/>
    <g class="badge" transform="translate(30,500)"><circle r="16"/><text y="6">3</text></g>
  </g>

  <!-- 4 Writer -->
  <g class="comp" id="c-writer" data-card="writer" tabindex="0">
    <rect class="bg" x="385" y="350" width="245" height="200" rx="24" fill="#E3EEFF"/>
    <g transform="translate(478,366)">
      <rect x="0" y="8" width="60" height="46" rx="14" fill="#4D96FF" stroke="#1E1B2E" stroke-width="3"/>
      <line x1="30" y1="8" x2="30" y2="0" stroke="#1E1B2E" stroke-width="3"/><circle cx="30" cy="0" r="4" fill="#FFD93D" stroke="#1E1B2E" stroke-width="2"/>
      <circle cx="19" cy="28" r="5" fill="#fff" stroke="#1E1B2E" stroke-width="2"/><circle cx="41" cy="28" r="5" fill="#fff" stroke="#1E1B2E" stroke-width="2"/>
      <path d="M20,42 Q30,48 40,42" fill="none" stroke="#1E1B2E" stroke-width="3" stroke-linecap="round"/>
      <path d="M62,44 L80,22 L86,28 L68,50 Z" fill="#FFD93D" stroke="#1E1B2E" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <text class="h" x="507" y="452" font-size="25" text-anchor="middle">Writer agent</text>
    <rect x="442" y="464" width="130" height="28" rx="14" fill="#4D96FF" stroke="#1E1B2E" stroke-width="3"/>
    <text class="b" x="507" y="483" font-size="15" font-weight="800" text-anchor="middle" style="fill:#fff">Claude Sonnet</text>
    <text class="b" x="507" y="517" font-size="15" text-anchor="middle">writes a draft</text>
    <text class="b" x="507" y="536" font-size="15" text-anchor="middle">in your voice</text>
    <g class="badge" transform="translate(385,350)"><circle r="16"/><text y="6">4</text></g>
  </g>

  <!-- 5 Compare -->
  <g class="comp" id="c-compare" data-card="compare" tabindex="0">
    <rect class="bg" x="680" y="135" width="470" height="290" rx="24" fill="#fff"/>
    <text class="h" x="915" y="163" font-size="22" text-anchor="middle">Side by side</text>
    <rect x="698" y="176" width="210" height="234" rx="18" fill="#E6F7E8" stroke="#1E1B2E" stroke-width="3"/>
    <rect x="922" y="176" width="210" height="234" rx="18" fill="#E3EEFF" stroke="#1E1B2E" stroke-width="3"/>
    <rect x="710" y="186" width="130" height="26" rx="13" fill="#6BCB77" stroke="#1E1B2E" stroke-width="3"/>
    <text class="b" x="775" y="204" font-size="13" font-weight="800" text-anchor="middle">YOUR real text</text>
    <rect x="934" y="186" width="130" height="26" rx="13" fill="#4D96FF" stroke="#1E1B2E" stroke-width="3"/>
    <text class="b" x="999" y="204" font-size="13" font-weight="800" text-anchor="middle" style="fill:#fff">AI draft</text>
    <text id="hertext" class="b" x="712" y="240" font-size="14"></text>
    <text id="aitext" class="b" x="936" y="240" font-size="14"></text>
    <text class="b" x="803" y="402" font-size="12" font-weight="800" text-anchor="middle">LEFT</text>
    <text class="b" x="1027" y="402" font-size="12" font-weight="800" text-anchor="middle">RIGHT</text>
    <g class="badge" transform="translate(680,135)"><circle r="16"/><text y="6">5</text></g>
  </g>

  <!-- 6 Judge -->
  <g class="comp" id="c-judge" data-card="judge" tabindex="0">
    <rect class="bg" x="680" y="455" width="470" height="170" rx="24" fill="#FFE5E5"/>
    <g transform="translate(700,478)">
      <line x1="32" y1="6" x2="32" y2="58" stroke="#1E1B2E" stroke-width="4" stroke-linecap="round"/>
      <line x1="6" y1="16" x2="58" y2="16" stroke="#1E1B2E" stroke-width="4" stroke-linecap="round"/>
      <path d="M0,34 L12,16 L24,34 Z" fill="#FFD93D" stroke="#1E1B2E" stroke-width="3" stroke-linejoin="round"/>
      <path d="M40,34 L52,16 L64,34 Z" fill="#FFD93D" stroke="#1E1B2E" stroke-width="3" stroke-linejoin="round"/>
      <rect x="18" y="56" width="28" height="8" rx="4" fill="#FF6B6B" stroke="#1E1B2E" stroke-width="3"/>
    </g>
    <text class="h" x="780" y="490" font-size="24">Judge agent</text>
    <rect x="782" y="500" width="118" height="26" rx="13" fill="#FF6B6B" stroke="#1E1B2E" stroke-width="3"/>
    <text class="b" x="841" y="518" font-size="14" font-weight="800" text-anchor="middle">Claude Opus</text>
    <text id="reasons" class="b" x="700" y="560" font-size="14"></text>
    <circle cx="1066" cy="528" r="50" fill="#fff" stroke="#1E1B2E" stroke-width="4"/>
    <text id="score" class="h" x="1066" y="542" font-size="38" text-anchor="middle">?</text>
    <text id="scorecap" class="b" x="1066" y="604" font-size="13" font-weight="800" text-anchor="middle">voice match</text>
    <g class="badge" transform="translate(680,455)"><circle r="16"/><text y="6">6</text></g>
  </g>

  <!-- 7 Decision -->
  <g class="comp" id="c-decision" data-card="decision" tabindex="0">
    <rect class="bg" x="1200" y="135" width="370" height="215" rx="24" fill="#FFF3C4"/>
    <text class="h" x="1222" y="172" font-size="25">Your decision</text>
    <text class="b" x="1404" y="171" font-size="14" font-weight="700">you have the final say</text>
    <g id="btn-approve"><rect class="pill" x="1222" y="188" width="155" height="44" rx="22" fill="#6BCB77" stroke="#1E1B2E" stroke-width="3"/><text class="h" x="1299" y="218" font-size="20" text-anchor="middle">✓ Approve</text></g>
    <g id="btn-reject"><rect class="pill" x="1393" y="188" width="155" height="44" rx="22" fill="#FF6B6B" stroke="#1E1B2E" stroke-width="3"/><text class="h" x="1470" y="218" font-size="20" text-anchor="middle">✗ Reject</text></g>
    <path d="M1222,250 h326 a12,12 0 0 1 12,12 v52 a12,12 0 0 1 -12,12 h-280 l-16,14 l0,-14 h-30 a12,12 0 0 1 -12,-12 v-52 a12,12 0 0 1 12,-12 z" fill="#fff" stroke="#1E1B2E" stroke-width="3"/>
    <text class="b" x="1234" y="274" font-size="13" font-weight="800" style="fill:#9B5DE5">YOUR COMMENT</text>
    <text id="comment" class="b" x="1234" y="300" font-size="15" font-weight="700">(waiting for a draft)</text>
    <g class="badge" transform="translate(1200,135)"><circle r="16"/><text y="6">7</text></g>
  </g>

  <!-- Approved shelf -->
  <g class="comp" id="c-shelf" data-card="shelf" tabindex="0">
    <rect class="bg" x="1200" y="375" width="370" height="95" rx="24" fill="#E6F7E8"/>
    <text class="h" x="1222" y="410" font-size="23">Approved posts</text>
    <text class="b" x="1222" y="432" font-size="14" font-weight="700">ready to post or record</text>
    <line x1="1400" y1="452" x2="1552" y2="452" stroke="#1E1B2E" stroke-width="4" stroke-linecap="round"/>
    <rect id="shelf-empty" x="1410" y="398" width="132" height="50" rx="10" fill="none" stroke="#1E1B2E" stroke-width="2" stroke-dasharray="6 5"/>
    <text id="shelf-emptytxt" class="b" x="1476" y="428" font-size="13" font-weight="700" text-anchor="middle">empty for now</text>
    <g id="book" style="display:none">
      <rect x="1414" y="396" width="34" height="54" rx="5" fill="#9B5DE5" stroke="#1E1B2E" stroke-width="3"/>
      <line x1="1422" y1="410" x2="1440" y2="410" stroke="#fff" stroke-width="3"/>
      <text class="b" x="1456" y="420" font-size="12" font-weight="800">Human</text>
      <text class="b" x="1456" y="436" font-size="12" font-weight="800">Psychology</text>
    </g>
  </g>

  <!-- 8 Updater -->
  <g class="comp" id="c-updater" data-card="updater" tabindex="0">
    <rect class="bg" x="1200" y="495" width="370" height="130" rx="24" fill="#F1E8FC"/>
    <g transform="translate(1220,520)">
      <circle cx="30" cy="30" r="26" fill="#9B5DE5" stroke="#1E1B2E" stroke-width="3"/>
      <path d="M18,30 a12,12 0 1 1 4,9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <path d="M14,36 L22,40 L24,31" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="h" x="1298" y="535" font-size="24">Updater agent</text>
    <text class="b" x="1298" y="558" font-size="14">turns your comment into</text>
    <text class="b" x="1298" y="577" font-size="14">a new rule in <tspan class="m" font-size="13" font-weight="700">voiceover.md</tspan></text>
    <text id="updnote" class="m" x="1298" y="606" font-size="12" font-weight="700" style="fill:#9B5DE5">waiting for feedback</text>
    <g class="badge" transform="translate(1200,495)"><circle r="16"/><text y="6">8</text></g>
  </g>

  <!-- 9 Score chart -->
  <g class="comp" id="c-chart" data-card="chart" tabindex="0">
    <rect class="bg" x="1060" y="684" width="510" height="160" rx="24" fill="#fff"/>
    <text class="h" x="1080" y="716" font-size="21">Voice match over rounds</text>
    <rect x="1380" y="697" width="172" height="26" rx="13" fill="#FF6B6B" stroke="#1E1B2E" stroke-width="3"/>
    <text class="b" x="1466" y="715" font-size="13" font-weight="800" text-anchor="middle">EXAMPLE numbers</text>
    <!-- axes: x 1130..1540, y 730..815 maps 50%..90% -->
    <line x1="1130" y1="815" x2="1545" y2="815" stroke="#1E1B2E" stroke-width="3" stroke-linecap="round"/>
    <line x1="1130" y1="732" x2="1130" y2="815" stroke="#1E1B2E" stroke-width="3" stroke-linecap="round"/>
    <text class="b" x="1122" y="819" font-size="11" text-anchor="end">50%</text>
    <text class="b" x="1122" y="741" font-size="11" text-anchor="end">90%</text>
    <line x1="1130" y1="776" x2="1545" y2="776" stroke="#1E1B2E" stroke-width="1" stroke-dasharray="3 5" opacity=".4"/>
    <text class="b" x="1122" y="780" font-size="11" text-anchor="end">70%</text>
    <polyline id="trend" points="" fill="none" stroke="#9B5DE5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline id="trendghost" points="" fill="none" stroke="#1E1B2E" stroke-width="2" stroke-dasharray="4 6" opacity=".35"/>
    <g id="pts"></g>
  </g>

  <!-- footer -->
  <text class="b" x="800" y="882" font-size="14" font-weight="700" text-anchor="middle">Prepared for Karen. Please don't share.</text>
  <text class="b" x="30" y="882" font-size="13" font-weight="700" opacity=".6">AI, Your Way</text>
  <g id="tokens"></g>
</svg>

<div id="panel">
  <div class="txt">
    <span id="stepno">Start</span>
    <div id="captitle"></div>
    <div id="captext"></div>
  </div>
  <div class="ctr">
    <div class="row"><button id="play">▶ Play</button></div>
    <div class="row"><button id="back">◀ Back</button><button id="next">Next ▶</button></div>
    <div id="dots"></div>
  </div>
</div>

<div id="card" role="dialog" aria-live="polite">
  <button class="x" id="cardx" aria-label="Close">✕</button>
  <span class="tag" id="ctag"></span>
  <h3 id="ctitle"></h3>
  <div class="k">What it does</div><div class="v" id="cwhat"></div>
  <div class="k">Who runs it</div><div class="v" id="cwho"></div>
  <div class="io"><div><b>Goes in</b><span id="cin"></span></div><div><b>Comes out</b><span id="cout"></span></div></div>
</div>
</div>

<script>
(function(){
  // ---------- scale stage to window ----------
  const stage=document.getElementById('stage');
  function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform='scale('+s+')';
    stage.style.left=((innerWidth-1600*s)/2)+'px';stage.style.top=((innerHeight-900*s)/2)+'px';}
  addEventListener('resize',fit);fit();

  const $=id=>document.getElementById(id);
  const NS='http://www.w3.org/2000/svg';
  const svg=$('dia');

  function setLines(el,lines,lh){
    el.textContent='';const x=el.getAttribute('x');
    lines.forEach((t,i)=>{const ts=document.createElementNS(NS,'tspan');ts.setAttribute('x',x);ts.setAttribute('dy',i?lh:0);ts.textContent=t;el.appendChild(ts);});
  }

  // ---------- content ----------
  const HER=["Ever wonder why we replay","old arguments at 2am?","Your mind isn't broken.","It's trying to keep you","safe. Let's breathe into","that together."];
  const AI1=["Human psychology is the","scientific study of the","mind. In this video we","will explore several key","concepts that influence","human behaviour."];
  const AI2=["Ever notice your mind","loves a rerun? It isn't","broken. It's guarding","you. Let's take one slow","breath and look closer."];
  const WAIT_HER=["(waiting...)"], WAIT_AI=["(waiting for the","Writer agent...)"];
  const R1=["✓ Same caring topic","✗ Too formal for you","✗ No opening question"];
  const R2=["✓ Opens with a question","✓ Calm, kind tone","✗ Still a little long"];
  const SCORES=[60,68,75,82];

  // chart geometry
  const cx=r=>1180+(r)*115, cy=v=>815-(v-50)*(83/40);
  const pts=$('pts');
  SCORES.forEach((v,i)=>{
    const g=document.createElementNS(NS,'g');g.setAttribute('id','pt'+i);
    g.innerHTML='<circle cx="'+cx(i)+'" cy="'+cy(v)+'" r="9" fill="#fff" stroke="#1E1B2E" stroke-width="3"/>'+
      '<text class="b" x="'+cx(i)+'" y="'+(cy(v)-15)+'" font-size="13" font-weight="800" text-anchor="middle">'+v+'%</text>'+
      '<text class="b" x="'+cx(i)+'" y="834" font-size="12" font-weight="700" text-anchor="middle">Round '+(i+1)+'</text>';
    pts.appendChild(g);
  });
  $('trendghost').setAttribute('points',SCORES.map((v,i)=>cx(i)+','+cy(v)).join(' '));

  // ---------- steps ----------
  const STEPS=[
    {t:"Meet your voiceover trainer",x:"Press Play to watch one training round, step by step. Or click any box to see what it does.",on:[],ar:[]},
    {t:"Pick your real writing",x:"From your voice library we pull a piece YOU wrote on Human Psychology. It sits on the LEFT, like an answer key.",on:['library','compare'],ar:['a']},
    {t:"Give the Writer its brief",x:"Your style rules (voiceover.md) and the topic both go to the Writer agent.",on:['vmd','topic','writer'],ar:['b','c']},
    {t:"The Writer drafts",x:"Claude Sonnet writes a draft in your voice. The AI draft lands on the RIGHT side.",on:['writer','compare'],ar:['d']},
    {t:"Side by side",x:"Your text on the left, the AI draft on the right. Same topic, so it is a fair comparison.",on:['compare'],ar:[]},
    {t:"The Judge scores it",x:"Claude Opus reads both and says: about 60% your voice. It also gives reasons why.",on:['compare','judge','chart'],ar:['e']},
    {t:"You decide",x:"Too formal for you, so you click Reject and leave a comment: \"Too formal. I always open with a question.\"",on:['judge','decision'],ar:['f']},
    {t:"The Updater learns",x:"The Updater agent turns your comment into a new rule and adds it to voiceover.md: + Open with a question.",on:['decision','updater','vmd','loop'],ar:['g','loop']},
    {t:"Round 2: write again",x:"Same topic, but voiceover.md now has the new rule. Sonnet writes a fresh draft.",on:['vmd','topic','writer','compare'],ar:['b','c','d']},
    {t:"Round 2 score",x:"Opus scores the new draft: about 68% your voice. Up from 60%!",on:['compare','judge','chart'],ar:['e']},
    {t:"Approved!",x:"It sounds like you, so you click Approve. The draft goes to your Approved posts shelf, and your comment still teaches the Updater.",on:['judge','decision','shelf','updater'],ar:['f','h','g']},
    {t:"Round after round",x:"Each round adds a rule and the match climbs. These are EXAMPLE numbers only: 60%, 68%, 75%, 82%.",on:['chart','loop','vmd'],ar:['loop']}
  ];
  const N=STEPS.length;
  let step=0,timer=null;

  const dots=$('dots');
  for(let i=1;i<N;i++){const d=document.createElement('span');d.title='Step '+i;d.onclick=()=>{stop();go(i)};dots.appendChild(d);}

  function show(id,on){$(id).style.display=on?'':'none';}
  function anim(el,cls){el.classList.remove(cls);void el.getBBox;void el.offsetWidth;el.classList.add(cls);}

  let lastState={};
  function render(){
    const s=STEPS[step];
    // dimming + highlights
    svg.classList.toggle('dimmed',step>0);
    document.querySelectorAll('.comp').forEach(c=>c.classList.toggle('active',s.on.includes(c.dataset.card)));
    document.querySelectorAll('.arrow').forEach(a=>{
      const on=s.ar.includes(a.id.slice(3));a.classList.toggle('active',on);
      a.querySelector('.line').setAttribute('marker-end',on?'url(#ahc)':'url(#ah)');
    });
    document.querySelectorAll('.alabel').forEach(l=>l.classList.toggle('active',s.ar.includes(l.id.slice(3))));

    // texts
    const st={
      her: step>=1?'her':'wait',
      ai: step<3?'wait':(step<8?'ai1':'ai2'),
      judge: step<5?'wait':(step<8?'r1':(step<9?'wait2':'r2')),
      rule: step>=7,
      dec: (step===6||step===7||step===8||step===9)?'rej':(step>=10?'app':'none'),
      shelf: step>=10,
      pts: step>=9?2:(step>=5?1:0),
      round: step>=8?2:1
    };
    if(step===11) st.pts=4;
    if(st.her!==lastState.her){setLines($('hertext'),st.her==='her'?HER:WAIT_HER,22);if(st.her==='her')anim($('hertext'),'fadein');}
    if(st.ai!==lastState.ai){setLines($('aitext'),st.ai==='wait'?WAIT_AI:(st.ai==='ai1'?AI1:AI2),22);if(st.ai!=='wait')anim($('aitext'),'fadein');}
    if(st.judge!==lastState.judge){
      const r=st.judge==='r1'?R1:(st.judge==='r2'?R2:["Waiting for both","texts..."]);
      setLines($('reasons'),r,20);
      $('score').textContent=st.judge==='r1'?'60%':(st.judge==='r2'?'68%':'?');
      $('scorecap').textContent=st.judge.startsWith('r')?'about '+(st.judge==='r1'?60:68)+'% your voice':'voice match';
      if(st.judge.startsWith('r'))anim($('score'),'fadein');
    }
    show('newrule',st.rule);
    if(st.rule&&!lastState.rule)anim($('newrule'),'fadein');
    $('updnote').textContent=step>=7?'+ Open with a question':(step===6?'comment on its way...':'waiting for feedback');
    $('btn-approve').style.opacity=st.dec==='rej'?.3:1;
    $('btn-reject').style.opacity=st.dec==='app'?.3:1;
    $('btn-approve').querySelector('rect').setAttribute('stroke-width',st.dec==='app'?6:3);
    $('btn-reject').querySelector('rect').setAttribute('stroke-width',st.dec==='rej'?6:3);
    $('comment').textContent=st.dec==='rej'?'"Too formal. I always open with a question."':(st.dec==='app'?'"Yes! This sounds like me."':'(waiting for a draft)');
    if(st.dec!==lastState.dec&&st.dec!=='none')anim($('comment'),'fadein');
    show('book',st.shelf);show('shelf-empty',!st.shelf);show('shelf-emptytxt',!st.shelf);
    if(st.shelf&&!lastState.shelf)anim($('book'),'fadein');
    SCORES.forEach((v,i)=>{const g=$('pt'+i),c=g.querySelector('circle');const lit=i<st.pts;
      c.setAttribute('fill',lit?'#FFD93D':'#fff');g.style.opacity=lit?1:.35;});
    $('trend').setAttribute('points',SCORES.slice(0,st.pts).map((v,i)=>cx(i)+','+cy(v)).join(' '));
    $('roundtxt').textContent='Round '+st.round;
    if(st.round!==lastState.round&&lastState.round)anim($('roundpill'),'fadein');
    lastState=st;

    // caption
    $('stepno').textContent=step===0?'Start':'Step '+step+' of '+(N-1);
    $('captitle').textContent=s.t;$('captext').textContent=s.x;
    $('back').disabled=step===0;$('next').disabled=step===N-1;
    [...dots.children].forEach((d,i)=>d.classList.toggle('on',i<step));
    if(!timer)$('play').textContent=step>=N-1?'↻ Play again':'▶ Play';
    tokens(s.ar);
  }

  // moving dots along active arrows
  let raf=null;
  function tokens(ids){
    cancelAnimationFrame(raf);const layer=$('tokens');layer.textContent='';
    const items=ids.map(id=>{const p=$('ar-'+id).querySelector('.line');const c=document.createElementNS(NS,'circle');
      c.setAttribute('r',8);c.setAttribute('class','token');layer.appendChild(c);return{p,c,L:p.getTotalLength()};});
    if(!items.length)return;const t0=performance.now();
    (function loop(now){items.forEach(it=>{const dur=Math.max(900,it.L*4);const f=((now-t0)%dur)/dur;
      const pt=it.p.getPointAtLength(f*it.L);it.c.setAttribute('cx',pt.x);it.c.setAttribute('cy',pt.y);});
      raf=requestAnimationFrame(loop);})(t0);
  }

  function go(i){step=Math.max(0,Math.min(N-1,i));render();}
  function stop(){clearInterval(timer);timer=null;$('play').textContent=step>=N-1?'↻ Play again':'▶ Play';}
  function play(){
    if(timer){stop();return;}
    if(step>=N-1)go(0);
    go(step+1);if(step>=N-1){stop();return;}$('play').textContent='❚❚ Pause';
    timer=setInterval(()=>{if(step>=N-1){stop();return;}go(step+1);if(step>=N-1)stop();},4200);
  }
  $('play').onclick=play;
  $('next').onclick=()=>{stop();go(step+1);stop();};
  $('back').onclick=()=>{stop();go(step-1);stop();};
  addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();else if(e.key==='ArrowLeft')$('back').click();
    else if(e.key===' '){e.preventDefault();play();}else if(e.key==='Escape')closeCard();});

  // ---------- info cards ----------
  const CARDS={
    library:{tag:'1 · Input',col:'#6BCB77',t:'Voice library',what:'Keeps writing you made yourself: old posts, video scripts, retreat notes. It is the answer key for how you really sound.',who:'No agent. It is just a folder in your Obsidian vault.',in:'Your own writing, no AI help.',out:'A real piece of yours on the same topic, shown on the left.'},
    vmd:{tag:'2 · Input',col:'#9B5DE5',t:'voiceover.md',what:'A note in your vault that lists your style rules, like "warm and calm" or "short sentences".',who:'You own it. The Updater agent adds new rule lines from your feedback.',in:'New rules after each round.',out:'Clear instructions for the Writer agent.'},
    topic:{tag:'3 · Input',col:'#FFD93D',t:'Topic',what:'The subject you want a post or script about.',who:'You type it in.',in:'An idea, like Human Psychology.',out:'The topic, sent to the Writer agent.'},
    writer:{tag:'4 · Agent',col:'#4D96FF',t:'Writer agent',what:'Writes a fresh draft in your voice, following every rule in voiceover.md.',who:'Claude Sonnet: quick and good at writing.',in:'voiceover.md + the topic.',out:'An AI draft, shown on the right.'},
    compare:{tag:'5 · Screen',col:'#FFFFFF',t:'Side by side',what:'Puts your real text and the AI draft next to each other so they are easy to compare. Yours on the LEFT, AI on the RIGHT.',who:'No agent. It is a screen in our app.',in:'Your text + the AI draft.',out:'Both texts, sent to the Judge.'},
    judge:{tag:'6 · Agent',col:'#FF6B6B',t:'Judge agent',what:'Reads both texts and scores how close the draft sounds to you, with short reasons.',who:'Claude Opus: slower, but sharper at judging.',in:'Your real text + the AI draft.',out:'A score like "about 60% your voice" plus reasons.'},
    decision:{tag:'7 · You',col:'#FFD93D',t:'Your decision',what:'You have the final say. Approve if it sounds like you, Reject if not, and leave a short comment either way.',who:'You, Karen. No AI here.',in:'The draft, the score and the reasons.',out:'Approved drafts go to the shelf. Your comment goes to the Updater.'},
    shelf:{tag:'Output',col:'#6BCB77',t:'Approved posts',what:'Keeps every draft you approved, ready to post or record as a voiceover.',who:'No agent. A folder in your vault.',in:'Drafts you approved.',out:'Posts and scripts you can use.'},
    updater:{tag:'8 · Agent',col:'#9B5DE5',t:'Updater agent',what:'Turns your comment into one clear new rule and adds it to voiceover.md.',who:'A small Claude helper (Sonnet is enough).',in:'Your comment, like "Too formal".',out:'A new rule line, like "+ Open with a question".'},
    chart:{tag:'9 · Progress',col:'#FFFFFF',t:'Voice match chart',what:'Shows how your voice match score changes round by round. These are EXAMPLE numbers, not real results yet.',who:'Uses the scores from the Judge agent.',in:'One score per round.',out:'A line that should climb: 60%, 68%, 75%, 82%.'},
    loop:{tag:'The loop',col:'#FFD93D',t:'Feedback loop',what:'Your feedback comes back as a new rule, so the next draft sounds a bit more like you. This is the "training".',who:'The Updater agent writes it, you approve it.',in:'Your comment.',out:'A smarter voiceover.md for the next round.'}
  };
  const card=$('card');
  function openCard(key,el){
    const c=CARDS[key];if(!c)return;
    $('ctag').textContent=c.tag;$('ctag').style.background=c.col;$('ctitle').textContent=c.t;
    $('cwhat').textContent=c.what;$('cwho').textContent=c.who;$('cin').textContent=c.in;$('cout').textContent=c.out;
    card.classList.remove('show');void card.offsetWidth;card.classList.add('show');
    const bb=el.querySelector('.bg').getBBox();const W=390,H=card.offsetHeight;
    let x=bb.x+bb.width+20;if(x+W>1585)x=bb.x-W-20;if(x<15)x=Math.min(1585-W,Math.max(15,bb.x+bb.width/2-W/2));
    let y=bb.y;if(y+H>855)y=855-H;if(y<15)y=15;
    card.style.left=x+'px';card.style.top=y+'px';
  }
  function closeCard(){card.classList.remove('show');}
  $('cardx').onclick=closeCard;
  document.querySelectorAll('.comp').forEach(c=>{
    c.addEventListener('click',e=>{e.stopPropagation();openCard(c.dataset.card,c);});
    c.addEventListener('keydown',e=>{if(e.key==='Enter'){openCard(c.dataset.card,c);}});
  });
  card.addEventListener('click',e=>e.stopPropagation());
  document.addEventListener('click',e=>{if(!e.target.closest('button'))closeCard();});

  window.__go=go;window.__N=N;
  render();
})();
</script>
</body>
</html>
